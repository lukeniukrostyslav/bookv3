name: Build EPUB

on:
  push:
    paths:
      - "manuscript/**"
      - "tools/build_epub.py"
      - ".github/workflows/build-epub.yml"
      - "assets/cover/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EPUB
        run: python3 tools/build_epub.py
      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOTEL_LAST_TOMORROW_EPUB
          path: dist/HOTEL_LAST_TOMORROW.epub
